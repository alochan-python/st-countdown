<style>
:root{
  --bg:#eef1f5;--card:#fff;--ink:#17202b;--sub:#566070;--line:#dde2e9;
  --navy:#14324f;--b1:#1e5aa8;--b1l:#cfe0f5;--b2:#0f7669;--b2l:#cdebe6;
  --ok:#23803a;--okl:#dff3e3;--warn:#b25e00;--warnl:#fff1dc;--exam:#b3122e;--examl:#fde3e7;
  --plan:#c3ccd8;--hi:#fff7d6;--other:#6b5ca5;--otherl:#e7e3f5
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a;--card:#18202a;--ink:#e7ecf2;--sub:#9aa6b6;--line:#2a3442;
  --navy:#9cc3ee;--b1:#6aa5ec;--b1l:#1f3550;--b2:#4cc2b0;--b2l:#173a36;
  --ok:#5fd07a;--okl:#173523;--warn:#f2a640;--warnl:#3a2a12;--exam:#ff6b81;--examl:#3d1820;
  --plan:#3b4757;--hi:#3a3418;--other:#a99be0;--otherl:#2a2542
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;min-height:44px}
button.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.primary{color:#0f141a}}
button.done{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
button.ghost{background:transparent}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px;min-height:40px}
input[type=number]{width:84px}
textarea{width:100%;min-height:64px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
h2{font-size:17px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sub{color:var(--sub);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.t-b1{background:var(--b1l);color:var(--b1)}.t-b2{background:var(--b2l);color:var(--b2)}
.t-ot{background:var(--otherl);color:var(--other)}.t-ev{background:var(--line);color:var(--sub)}
.t-ok{background:var(--okl);color:var(--ok)}.t-warn{background:var(--warnl);color:var(--warn)}.t-exam{background:var(--examl);color:var(--exam)}

/* ① countdown */
.count{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-left:6px solid var(--exam)}
.count .big{font-size:52px;font-weight:800;color:var(--exam);line-height:1}
.count .lbl{font-weight:700}
.stages{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.stage{flex:1 1 110px;border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;color:var(--sub)}
.stage b{display:block;font-size:14px;color:var(--ink)}
.stage.cur{border:2px solid var(--navy);background:var(--hi);color:var(--ink)}
.stage.past{opacity:.6}
.stage.final{border-color:var(--exam)}
.streak{font-weight:700}

/* ② next */
.next{border:2px solid var(--navy);padding:20px}
.next .time{font-size:20px;font-weight:700;color:var(--sub)}
.next .title{font-size:30px;font-weight:800;line-height:1.3;margin:4px 0}
.next .unit{font-size:18px;color:var(--sub)}
.next .meta{font-size:18px;margin-top:6px}
.next .btns{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.next .btns button{font-size:20px;min-height:60px;padding:12px 28px;flex:1 1 180px}
.alert{border-radius:10px;padding:10px 12px;font-weight:700;margin-top:12px}
.alert.warn{background:var(--warnl);color:var(--warn)}
.alert.ok{background:var(--okl);color:var(--ok)}
.alert.info{background:var(--b1l);color:var(--b1)}
.running{font-size:22px;font-weight:800;color:var(--ok)}

/* ③ ring */
.ach{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{width:150px;height:150px;flex:none}
.ach .txt{flex:1;min-width:220px}
.ach .pctline{font-size:20px;font-weight:700}
.bar{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:7px;transition:width .3s}
.achieved{border:2px solid var(--ok);background:linear-gradient(0deg,var(--okl),var(--card) 60%)}
.achieved-msg{font-size:22px;font-weight:800;color:var(--ok)}

/* ④ today numbers */
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.num{border:1px solid var(--line);border-radius:12px;padding:12px}
.num .k{font-size:14px;color:var(--sub);font-weight:700}
.num .v{font-size:24px;font-weight:800}
.num .s{font-size:14px;color:var(--sub)}
.left ul{margin:6px 0 0;padding-left:1.2em;font-size:17px}
.left li{margin:2px 0}

/* ⑤ schedule */
.task{display:grid;grid-template-columns:92px 1fr;gap:10px;border-top:1px solid var(--line);padding:12px 0}
.task:first-child{border-top:0}
.task .tm{font-weight:700;font-size:15px;color:var(--sub)}
.task .tt{font-weight:700;font-size:17px}
.task.isdone .tt{text-decoration:line-through;text-decoration-color:var(--ok)}
.task.isnext{background:var(--hi);border-radius:10px;padding:12px 8px;margin:0 -8px}
.task.late .tm{color:var(--warn)}
.task .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.task .ctl label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center}
.task details{margin-top:6px}
.task summary{cursor:pointer;color:var(--sub);font-size:14px;min-height:32px}
.ev .tt{font-weight:600;color:var(--sub)}

/* ⑥ progress */
.pg{margin:12px 0}
.pg .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pg .nm{font-weight:700;font-size:16px}
.pg .ct{font-weight:800;font-size:18px}
.pg .rm{margin-left:auto;font-size:15px}
.pg .bar{height:18px;position:relative;margin-top:4px}
.pg .minmark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.cum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}

/* ⑦ chart */
.chartwrap{position:relative;width:100%}
.chartwrap svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);border-radius:8px;padding:8px 10px;font-size:14px;line-height:1.45;white-space:nowrap;display:none;z-index:2}
.legend{display:flex;gap:16px;font-size:14px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* ⑧ subs */
.subrow{display:grid;grid-template-columns:1fr auto;gap:8px;border-top:1px solid var(--line);padding:10px 0}
.subrow:first-child{border-top:0}
.subrow .ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;grid-column:1/-1}
.subrow .ctl label{font-size:14px;color:var(--sub);display:flex;gap:6px;align-items:center}

/* ⑨ nav */
.daynav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.daynav .cur{font-size:18px;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
.chips button{min-height:40px;padding:6px 10px;font-size:14px;white-space:nowrap}
.chips button.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
@media (prefers-color-scheme:dark){.chips button.sel{color:#0f141a}}
.notes{font-size:15px;background:var(--hi);border-radius:10px;padding:10px 12px;margin-bottom:8px}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;transition:opacity .25s,transform .25s;
  background:var(--ok);color:#fff;border-radius:14px;padding:14px 22px;font-weight:800;font-size:18px;text-align:center;z-index:10;box-shadow:0 6px 24px rgba(0,0,0,.2);pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{color:var(--sub);font-size:14px;text-align:center}
footer .row{justify-content:center;margin:10px 0}
@media (max-width:600px){
  .next .title{font-size:24px}
  .count .big{font-size:42px}
  .task{grid-template-columns:1fr}
}
</style>
</head>

function dayStats(d) {

  const plan = DAY[d].plan;
  const donePlan = doneT.reduce((s, t) => s + t.min, 0);

    flP: sumType(ts, "fl", "cnt"), flA: doneT.filter(t => t.type === "fl").reduce((s, t) => s + actCnt(t), 0)};

  <div class="pg"><div class="hd"><span class="nm">累計学習時間</span><span class="ct">${Math.round(p * 100)}%</span></div><div class="bar"><i style="width:${Math.min(100, p * 100)}%;background:var(--navy)"></i></div></div>
  ${rows.map(([k, nm, g]) => {
    const a = tot[k], tg = TARGETS[k].tgt, mn = TARGETS[k].min, r = Math.max(0, tg - a), pp = tg ? a / tg : 0, u = TYPES[k].unit;
    return `<div class="pg" data-pg="${k}"><div class="hd"><span class="nm">${nm}</span><span class="ct"><span data-v>${a}</span> / ${tg}${u}</span>
    <span class="sub">${Math.round(pp * 100)}%</span><span class="rm">${r ? `残り <b>${r}</b>${u}` : `<span class="tag t-ok">✓ 目標達成</span>`}${a < mn ? `<span class="sub">（最低${mn}）</span>` : ""}</span></div>
    <div class="bar"><i style="width:${Math.min(100, pp * 100)}%;background:${pp >= 1 ? "var(--ok)" : g === "b1" ? "var(--b1)" : "var(--b2)"}"></i>
    ${mn < tg ? `<span class="minmark" style="left:${mn / tg * 100}%" title="最低目標"></span>` : ""}</div></div>`;
  }).join("")}
  <div class="sub">縦線＝最低目標。TAC全国模試はB1本番90分④・B2フル論文④として1回ずつだけ数え、答案提出は提出管理の5通で数えます。</div></section>`;
}

function secChart(td) {
  const ds = STUDY_DATES, W = 700, H = 280, L = 44, R = 8, T = 26, B = 40;
  const data = ds.map(d => ({d, p: DAY[d].plan, a: dayStats(d).act}));
  const max = Math.max(300, ...data.map(x => Math.max(x.p, x.a)));
  const ymax = Math.ceil(max / 100) * 100, gw = (W - L - R) / ds.length, bw = gw * 0.34;
  const y = v => T + (H - T - B) * (1 - v / ymax);
  let g = "";
  for (let v = 0; v <= ymax; v += 100) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="var(--sub)">${v}</text>`;
  data.forEach((x, i) => {
    const gx = L + gw * i, isT = x.d === td, cx = gx + gw / 2;
    if (isT) g += `<rect x="${gx + 1}" y="${T - 22}" width="${gw - 2}" height="${H - T - B + 22}" fill="var(--hi)" rx="4"/><text x="${cx}" y="${T - 8}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--exam)">今日</text>`;
    g += `<rect x="${cx - bw - 1}" y="${y(x.p)}" width="${bw}" height="${y(0) - y(x.p)}" fill="var(--plan)" rx="2"/>`;
    g += `<rect x="${cx + 1}" y="${y(x.a)}" width="${bw}" height="${Math.max(0, y(0) - y(x.a))}" fill="${x.p && x.a >= x.p ? "var(--ok)" : "var(--navy)"}" rx="2" data-bar="${x.d}"/>`;
    const dd = toD(x.d);
    g += `<text x="${cx}" y="${H - B + 16}" text-anchor="middle" font-size="12" fill="${isT ? "var(--exam)" : "var(--ink)"}" font-weight="${isT ? 700 : 400}">${dd.getMonth() + 1}/${dd.getDate()}</text>
          <text x="${cx}" y="${H - B + 31}" text-anchor="middle" font-size="11" fill="var(--sub)">${DOW[dd.getDay()]}</text>`;
    g += `<rect class="hit" x="${gx}" y="${T}" width="${gw}" height="${H - T}" fill="transparent" data-d="${x.d}" data-p="${x.p}" data-a="${x.a}"/>`;
  });
  return `<section class="card" id="sec-chart"><h2>日別 予定時間 vs 実績時間（分）</h2>
  <div class="legend"><span><i style="background:var(--plan)"></i>予定</span><span><i style="background:var(--navy)"></i>実績</span><span><i style="background:var(--ok)"></i>実績（予定以上）</span><span>棒をタップで詳細</span></div>
  <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" id="chart" role="img" aria-label="日別の予定と実績">${g}</svg><div class="tip" id="tip"></div></div></section>`;
}

function secSubs(td) {
  return `<section class="card" id="sec-subs"><h2>提出物状況　<span class="sub">未提出 ${SUBS.filter(s => !["提出済み", "返却済み"].includes(S.subs[s.id].status)).length} / ${SUBS.length}</span></h2>
  ${SUBS.map(s => {
    const x = S.subs[s.id], done = ["提出済み", "返却済み"].includes(x.status), late = !done && s.due < td;
    return `<div class="subrow" data-sub="${s.id}"><div><b>${esc(s.name)}</b><div class="sub">予定 ${md(s.due)}${x.memo ? "／" + esc(x.memo) : ""}</div></div>
    <div>${done ? `<span class="tag t-ok">✓ ${esc(x.status)}</span>` : late ? `<span class="tag t-warn">⚠ 期限超過・${esc(x.status)}</span>` : `<span class="tag t-ev">${esc(x.status)}</span>`}</div>
    <div class="ctl"><label>状態<select data-sf="status" data-id="${s.id}">${STATUSES.map(v => `<option ${v === x.status ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label>提出日<input type="date" data-sf="submitted" data-id="${s.id}" value="${x.submitted || ""}"></label>
    <label>返却日<input type="date" data-sf="returned" data-id="${s.id}" value="${x.returned || ""}"></label>
    <label style="flex:1 1 220px">メモ<input style="flex:1" type="text" data-sf="memo" data-id="${s.id}" value="${esc(x.memo || "")}"></label></div></div>`;
  }).join("")}</section>`;
}

function secDays(td) {
  if (!viewDate) viewDate = DAY[addDays(td, 1)] ? addDays(td, 1) : (DAY[td] ? td : DATES[0]);
  const d = viewDate, i = DATES.indexOf(d);
  let h = `<section class="card" id="sec-days"><h2>過去日・未来日のスケジュール</h2>
  <div class="daynav"><button data-nav="-1" ${i <= 0 ? "disabled" : ""}>◀ 前日</button><button data-nav="0">今日</button><button data-nav="1" ${i >= DATES.length - 1 ? "disabled" : ""}>翌日 ▶</button>
  <span class="cur">${md(d)}${d === td ? "（今日）" : ""}</span></div>
  <div class="chips">${DATES.map(x => { const s = dayStats(x), full = s.n && s.nd === s.n;
    return `<button data-go="${x}" class="${x === d ? "sel" : ""}">${md(x)}${x === EXAM ? " 本番" : full ? " ✓" : s.nd ? ` ${s.nd}/${s.n}` : ""}</button>`; }).join("")}</div>`;
  if (d === EXAM) h += `<div class="notes"><b>${md(d)} 本番</b><br>${esc(PLAN[d].note)}</div>${EXAM_EVENTS.map(e => `<div class="task ev"><div class="tm">${e[0]}<br>〜${e[1]}</div><div><span class="tag t-exam">本番</span><div class="tt">${esc(e[2])}</div></div></div>`).join("")}`;
  else h += scheduleHTML(d, td);
  return h + `</section>`;
}

function render() {
  const td = today();
  const y = window.scrollY;
  document.getElementById("app").innerHTML = secCountdown(td) + secNext(td) + secAch(td) + secNums(td) + secToday(td) + secProgress() + secChart(td) + secSubs(td) + secDays(td);
  window.scrollTo(0, y);
  lastDay = td;
}
let lastDay = null;

/* ================= イベント ================= */
const app = document.getElementById("app");
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "start") startTask(b.dataset.id);
  else if (b.dataset.act === "done") completeTask(b.dataset.id);
  else if (b.dataset.act === "undo") undoTask(b.dataset.id);
  else if (b.dataset.nav != null) {
    const n = Number(b.dataset.nav), td = today();
    viewDate = n === 0 ? (DAY[td] ? td : DATES[0]) : DATES[Math.min(DATES.length - 1, Math.max(0, DATES.indexOf(viewDate) + n))];
    render();
  } else if (b.dataset.go) { viewDate = b.dataset.go; render(); }
});
app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.f === "dayMemo") { S.dayMemo[el.dataset.day] = el.value; save(); return; }
  if (el.dataset.f) {
    const x = st(el.dataset.id), f = el.dataset.f;
    if (f === "actMin" || f === "actCnt") x[f] = Math.max(0, Number(el.value) || 0); else x[f] = el.value;
    save(); if (f !== "memo") render(); return;
  }
  if (el.dataset.sf) {
    const x = S.subs[el.dataset.id], f = el.dataset.sf;
    x[f] = el.value;
    if (f === "status" && ["提出済み", "返却済み"].includes(el.value) && !x.submitted) x.submitted = today();
    if (f === "status" && !["提出済み", "返却済み"].includes(el.value)) { x.submitted = ""; x.returned = ""; }
    save(); render();
  }
});
function showTip(r, ev) {
  const tip = document.getElementById("tip"), wrap = tip.parentElement;
  const p = +r.dataset.p, a = +r.dataset.a;
  tip.innerHTML = `<b>${md(r.dataset.d)}</b><br>予定：${p}分<br>実績：${a}分<br>達成率：${p ? Math.round(a / p * 100) : 0}%`;
  tip.style.display = "block";
  const wb = wrap.getBoundingClientRect(), rb = r.getBoundingClientRect();
  let left = rb.left - wb.left + rb.width / 2 - tip.offsetWidth / 2;
  left = Math.max(0, Math.min(wb.width - tip.offsetWidth, left));
  tip.style.left = left + "px"; tip.style.top = "4px";
}
app.addEventListener("pointerover", e => { const r = e.target.closest("rect.hit"); if (r) showTip(r, e); });
app.addEventListener("pointerout", e => { if (e.target.closest("rect.hit") && e.pointerType === "mouse") document.getElementById("tip").style.display = "none"; });
app.addEventListener("click", e => { const r = e.target.closest("rect.hit"); if (r) showTip(r, e); });
document.getElementById("exportBtn").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], {type: "application/json"}));
  a.download = `st-dashboard-backup-${today()}.json`; a.click();
};
document.getElementById("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.tasks || !d.subs) throw 0; if (confirm("現在のデータを読み込んだデータで置き換えますか？")) { S = d; save(); render(); toast("読み込みました"); } }
  catch (err) { alert("読み込めませんでした（バックアップJSONを選んでください）"); }
  e.target.value = "";
};
// 経過時間の更新・日付変更時の自動更新
setInterval(() => {
  if (today() !== lastDay) { viewDate = null; render(); return; }
  const el = document.getElementById("elapsed");
  if (el) el.textContent = elapsed(st(el.dataset.id));
}, 1000);
setInterval(() => { if (!document.querySelector("input:focus,textarea:focus,select:focus")) render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !document.querySelector("input:focus,textarea:focus")) render(); });
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
